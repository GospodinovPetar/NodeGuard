services:
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./NodeGuard:/app
    ports:
      - "8000:8000"

  worker:
    build: .
    command: python manage.py run_huey
    volumes:
      - ./NodeGuard:/app
    depends_on:
      - web
