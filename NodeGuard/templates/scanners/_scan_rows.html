{% load scan_extras %}
<table class="w-full text-left text-sm">
    <thead class="text-slate-400 bg-slate-900/60">
        <tr>
            <th class="px-4 py-2 w-12">#</th>
            <th class="px-4 py-2">Target</th>
            <th class="px-4 py-2">Scanner</th>
            <th class="px-4 py-2">Status</th>
            <th class="px-4 py-2">Findings</th>
        </tr>
    </thead>
    <tbody>
        {% for scan in scans %}
        <tr class="border-t border-slate-800 align-top">
            <td class="px-4 py-3 text-slate-500">{{ scan.id }}</td>
            <td class="px-4 py-3 font-mono">
                <a href="{% url 'scanners:target_detail' scan.target.pk %}"
                   class="text-brand hover:underline">{{ scan.target }}</a>
            </td>
            <td class="px-4 py-3">{{ scan.scanner_name }}</td>
            <td class="px-4 py-3">
                <span class="px-2 py-0.5 rounded text-xs {{ scan.status|status_classes }}">{{ scan.status }}</span>
            </td>
            <td class="px-4 py-3">
                {% include "scanners/_scan_findings.html" with scan=scan %}
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="5" class="px-4 py-6 text-center text-slate-500">No scans yet.</td></tr>
        {% endfor %}
    </tbody>
</table>
