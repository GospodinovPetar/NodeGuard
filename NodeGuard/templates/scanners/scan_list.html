{% extends "base.html" %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">Scans</h1>

<form method="post" action="{% url 'scanners:trigger' %}" class="mb-6 flex gap-2 items-end">
    {% csrf_token %}
    <div>
        <label class="block text-xs text-slate-400 mb-1" for="target">Target</label>
        <input type="text" id="target" name="target" placeholder="127.0.0.1 или http://host"
               class="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm w-64" required>
    </div>
    <div>
        <label class="block text-xs text-slate-400 mb-1" for="scanner">Scanner</label>
        <select id="scanner" name="scanner" class="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm">
            {% for name, scanner in scanners.items %}
            <option value="{{ name }}" {% if not scanner.is_available %}disabled{% endif %}>
                {{ name }}{% if not scanner.is_available %} (не е инсталиран){% endif %}
            </option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="bg-emerald-700 hover:bg-emerald-600 px-4 py-2 rounded text-sm">
        Trigger scan
    </button>
</form>

<div id="scan-table"
     hx-get="{% url 'scanners:rows' %}"
     hx-trigger="every 2s"
     hx-swap="innerHTML">
    {% include "scanners/_scan_rows.html" %}
</div>
{% endblock %}
